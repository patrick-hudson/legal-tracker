name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run linter (if configured)
      working-directory: ./backend
      run: npm run lint --if-present

    - name: Run tests
      working-directory: ./backend
      run: npm test

    - name: Generate validation report
      if: matrix.node-version == '20.x'
      working-directory: ./backend
      run: npm test -- test/validation-report.test.js

    - name: Archive validation report with timestamp and commit hash
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      run: |
        mkdir -p backend/test/validation-reports
        TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
        COMMIT_HASH=$(git rev-parse --short HEAD)
        JSON_FILENAME="validation-report-${TIMESTAMP}-${COMMIT_HASH}.json"
        MD_FILENAME="validation-report-${TIMESTAMP}-${COMMIT_HASH}.md"
        cp backend/test-validation-report.json "backend/test/validation-reports/${JSON_FILENAME}"
        cp backend/test-validation-report.md "backend/test/validation-reports/${MD_FILENAME}"
        echo "Generated reports: ${JSON_FILENAME} and ${MD_FILENAME}"
        ls -lh backend/test/validation-reports/

    - name: Determine version bump type
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      id: version_type
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if echo "$COMMIT_MSG" | grep -qi "\[MAJOR\]"; then
          echo "type=major" >> $GITHUB_OUTPUT
        elif echo "$COMMIT_MSG" | grep -qi "\[MINOR\]"; then
          echo "type=minor" >> $GITHUB_OUTPUT
        else
          echo "type=patch" >> $GITHUB_OUTPUT
        fi

    - name: Update version
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      working-directory: ./backend
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        node scripts/update-version.js ${{ steps.version_type.outputs.type }}
        NEW_VERSION=$(cat ../VERSION)
        echo "Updated to version $NEW_VERSION"

    - name: Commit validation report and version bump
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add -f backend/test/validation-reports/
        git add VERSION README.md backend/package.json frontend/app.js
        NEW_VERSION=$(cat VERSION)
        git diff --staged --quiet || git commit -m "Release version $NEW_VERSION and add validation report [skip ci]"

    - name: Create version tag
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      run: |
        NEW_VERSION=$(cat VERSION)
        git tag "v$NEW_VERSION" || echo "Tag already exists"

    - name: Push changes and tags
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
        tags: true

    - name: Upload validation report as artifact
      if: matrix.node-version == '20.x'
      uses: actions/upload-artifact@v4
      with:
        name: validation-report-${{ github.sha }}
        path: |
          backend/test-validation-report.json
          backend/test-validation-report.md
        retention-days: 30

    - name: Build check
      working-directory: ./backend
      run: npm run build --if-present

  lint-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check frontend files exist
      run: |
        test -f frontend/index.html || (echo "Missing index.html" && exit 1)
        test -f frontend/app.js || (echo "Missing app.js" && exit 1)
        echo "Frontend files validated"
