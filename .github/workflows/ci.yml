name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run linter (if configured)
      working-directory: ./backend
      run: npm run lint --if-present

    - name: Run tests
      working-directory: ./backend
      run: npm test

    - name: Determine version bump type
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      id: version_type
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if echo "$COMMIT_MSG" | grep -qi "\[MAJOR\]"; then
          echo "type=major" >> $GITHUB_OUTPUT
        elif echo "$COMMIT_MSG" | grep -qi "\[MINOR\]"; then
          echo "type=minor" >> $GITHUB_OUTPUT
        else
          echo "type=patch" >> $GITHUB_OUTPUT
        fi

    - name: Update version
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      working-directory: ./backend
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        node scripts/update-version.js ${{ steps.version_type.outputs.type }}
        NEW_VERSION=$(cat ../VERSION)
        echo "Updated to version $NEW_VERSION"

    - name: Update CHANGELOG
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      run: |
        NEW_VERSION=$(cat VERSION)
        TODAY=$(date +%Y-%m-%d)
        # Replace [Unreleased] with version number and date, add new Unreleased section
        sed -i "s/## \[Unreleased\]/## [Unreleased]\n\n---\n\n## [$NEW_VERSION] - $TODAY/" CHANGELOG.md
        # Update Version History Summary table - replace "Unreleased" row with new version and add fresh Unreleased row
        # Extract the highlights from the current Unreleased row
        HIGHLIGHTS=$(grep -E '^\| Unreleased \|' CHANGELOG.md | sed 's/.*| - | \(.*\) |$/\1/' || echo "")
        if [ -n "$HIGHLIGHTS" ]; then
          # Replace the Unreleased row with the new version, keeping the highlights
          sed -i "s/| Unreleased | - | \(.*\) |/| Unreleased | - | |\n| $NEW_VERSION | $TODAY | \1 |/" CHANGELOG.md
        fi

    - name: Commit version bump
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add VERSION README.md backend/package.json frontend/app.js CHANGELOG.md
        NEW_VERSION=$(cat VERSION)
        git diff --staged --quiet || git commit -m "Release version $NEW_VERSION [skip ci]"

    - name: Create version tag
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      run: |
        NEW_VERSION=$(cat VERSION)
        git tag "v$NEW_VERSION" || echo "Tag already exists"

    - name: Push changes and tags
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
        tags: true

    - name: Extract changelog for release
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      id: changelog
      run: |
        NEW_VERSION=$(cat VERSION)
        # Extract content from the version section (between version header and next ---)
        # The CHANGELOG has been updated so [Unreleased] is now [$NEW_VERSION]
        NOTES=$(awk -v ver="$NEW_VERSION" '/^## \['"$NEW_VERSION"'\]/{flag=1; next} /^---$/{if(flag) exit} flag' CHANGELOG.md)
        # If no version content, fall back to commit message
        if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
          NOTES=$(git log -1 --pretty=%B)
        fi
        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        # Use delimiter for multiline output
        echo "notes<<EOF" >> $GITHUB_OUTPUT
        echo "$NOTES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create GitHub Release
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.changelog.outputs.version }}
        name: v${{ steps.changelog.outputs.version }}
        body: ${{ steps.changelog.outputs.notes }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Build check
      working-directory: ./backend
      run: npm run build --if-present

  lint-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check frontend files exist
      run: |
        test -f frontend/index.html || (echo "Missing index.html" && exit 1)
        test -f frontend/app.js || (echo "Missing app.js" && exit 1)
        echo "Frontend files validated"
