name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run linter (if configured)
      working-directory: ./backend
      run: npm run lint --if-present

    - name: Test Auth
      working-directory: ./backend
      run: node --test test/auth/*.test.js
      timeout-minutes: 10

    - name: Test Matters
      working-directory: ./backend
      run: node --test test/matters/*.test.js
      timeout-minutes: 5

    - name: Test Private Notes
      working-directory: ./backend
      run: node --test test/private-notes/*.test.js
      timeout-minutes: 5

    - name: Test Attachments
      working-directory: ./backend
      run: node --test test/attachments/*.test.js
      timeout-minutes: 5

    - name: Test Audit Log
      working-directory: ./backend
      run: node --test test/audit-log/*.test.js
      timeout-minutes: 5

    - name: Test Data Management
      working-directory: ./backend
      run: node --test test/data-management/*.test.js
      timeout-minutes: 15

    - name: Test Sample Data
      working-directory: ./backend
      run: node --test test/sample-data/*.test.js
      timeout-minutes: 5

    - name: Test Security
      working-directory: ./backend
      run: node --test test/security/*.test.js
      timeout-minutes: 5

    - name: Test Utils
      working-directory: ./backend
      run: node --test test/utils/*.test.js
      timeout-minutes: 5

    - name: Build check
      working-directory: ./backend
      run: npm run build --if-present

  # Record failed build info for aggregated release notes
  record-failed-build:
    runs-on: ubuntu-latest
    needs: test
    if: failure() && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Record failed build
      run: |
        PENDING_FILE=".github/pending-releases.json"
        COMMIT_SHA="${{ github.sha }}"
        COMMIT_MSG=$(git log -1 --pretty=%B)
        COMMIT_DATE=$(git log -1 --pretty=%ci)
        RUN_NUMBER="${{ github.run_number }}"
        RUN_ID="${{ github.run_id }}"

        # Initialize or load existing pending releases
        if [ -f "$PENDING_FILE" ]; then
          PENDING=$(cat "$PENDING_FILE")
        else
          mkdir -p .github
          PENDING='{"failed_builds":[]}'
        fi

        # Add this failed build
        NEW_ENTRY=$(cat <<EOF
        {
          "run_number": $RUN_NUMBER,
          "run_id": "$RUN_ID",
          "commit_sha": "$COMMIT_SHA",
          "commit_date": "$COMMIT_DATE",
          "commit_message": $(echo "$COMMIT_MSG" | head -1 | jq -Rs .)
        }
        EOF
        )

        # Append to failed_builds array
        UPDATED=$(echo "$PENDING" | jq --argjson entry "$NEW_ENTRY" '.failed_builds += [$entry]')
        echo "$UPDATED" > "$PENDING_FILE"

        echo "Recorded failed build #$RUN_NUMBER"
        cat "$PENDING_FILE"

    - name: Commit pending release info
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add .github/pending-releases.json
        git diff --staged --quiet || git commit -m "Record failed build #${{ github.run_number }} [skip ci]"

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}

  # Release job runs only when tests pass
  release:
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.event_name == 'push'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Determine version bump type
      id: version_type
      run: |
        COMMIT_MSG=$(git log -1 --pretty=%B)
        if echo "$COMMIT_MSG" | grep -qi "\[MAJOR\]"; then
          echo "type=major" >> $GITHUB_OUTPUT
        elif echo "$COMMIT_MSG" | grep -qi "\[MINOR\]"; then
          echo "type=minor" >> $GITHUB_OUTPUT
        else
          echo "type=patch" >> $GITHUB_OUTPUT
        fi

    - name: Update version
      working-directory: ./backend
      run: |
        node scripts/update-version.js ${{ steps.version_type.outputs.type }}
        NEW_VERSION=$(cat ../VERSION)
        echo "Updated to version $NEW_VERSION"

    - name: Update CHANGELOG
      run: |
        NEW_VERSION=$(cat VERSION)
        TODAY=$(date +%Y-%m-%d)
        # Replace [Unreleased] with version number and date, add new Unreleased section
        sed -i "s/## \[Unreleased\]/## [Unreleased]\n\n---\n\n## [$NEW_VERSION] - $TODAY/" CHANGELOG.md
        # Update Version History Summary table - replace "Unreleased" row with new version and add fresh Unreleased row
        HIGHLIGHTS=$(grep -E '^\| Unreleased \|' CHANGELOG.md | sed 's/.*| - | \(.*\) |$/\1/' || echo "")
        if [ -n "$HIGHLIGHTS" ]; then
          sed -i "s/| Unreleased | - | \(.*\) |/| Unreleased | - | |\n| $NEW_VERSION | $TODAY | \1 |/" CHANGELOG.md
        fi

    - name: Extract changelog for release
      id: changelog
      run: |
        NEW_VERSION=$(cat VERSION)
        PENDING_FILE=".github/pending-releases.json"

        # Extract content from the version section
        NOTES=$(awk -v ver="$NEW_VERSION" '/^## \['"$NEW_VERSION"'\]/{flag=1; next} /^---$/{if(flag) exit} flag' CHANGELOG.md)

        # If no version content, fall back to commit message
        if [ -z "$(echo "$NOTES" | tr -d '[:space:]')" ]; then
          NOTES=$(git log -1 --pretty=%B)
        fi

        # Check for pending failed builds
        if [ -f "$PENDING_FILE" ]; then
          FAILED_COUNT=$(jq '.failed_builds | length' "$PENDING_FILE")
          if [ "$FAILED_COUNT" -gt 0 ]; then
            PENDING_NOTES=$'\n\n### Previously Failed Builds\n\nThe following builds failed before this release:\n'

            # Iterate through failed builds
            for i in $(seq 0 $((FAILED_COUNT - 1))); do
              RUN_NUM=$(jq -r ".failed_builds[$i].run_number" "$PENDING_FILE")
              RUN_ID=$(jq -r ".failed_builds[$i].run_id" "$PENDING_FILE")
              COMMIT_SHA=$(jq -r ".failed_builds[$i].commit_sha" "$PENDING_FILE")
              COMMIT_DATE=$(jq -r ".failed_builds[$i].commit_date" "$PENDING_FILE")
              COMMIT_MSG=$(jq -r ".failed_builds[$i].commit_message" "$PENDING_FILE")
              SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)
              SHORT_DATE=$(echo "$COMMIT_DATE" | cut -d' ' -f1)

              PENDING_NOTES="${PENDING_NOTES}"$'\n'"- **Build #${RUN_NUM}** (${SHORT_DATE}): ${COMMIT_MSG} (\`${SHORT_SHA}\`)"
            done

            NOTES="${NOTES}${PENDING_NOTES}"
          fi
        fi

        echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "notes<<EOF" >> $GITHUB_OUTPUT
        echo "$NOTES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Clear pending releases
      run: |
        PENDING_FILE=".github/pending-releases.json"
        if [ -f "$PENDING_FILE" ]; then
          rm "$PENDING_FILE"
          echo "Cleared pending releases file"
        fi

    - name: Commit version bump
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add VERSION README.md backend/package.json frontend/app.js CHANGELOG.md
        # Also remove pending releases file if it was deleted
        git add -A .github/pending-releases.json 2>/dev/null || true
        NEW_VERSION=$(cat VERSION)
        git diff --staged --quiet || git commit -m "Release version $NEW_VERSION [skip ci]"

    - name: Create version tag
      run: |
        NEW_VERSION=$(cat VERSION)
        git tag "v$NEW_VERSION" || echo "Tag already exists"

    - name: Push changes and tags
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}
        tags: true

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.changelog.outputs.version }}
        name: v${{ steps.changelog.outputs.version }}
        body: ${{ steps.changelog.outputs.notes }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check frontend files exist
      run: |
        test -f frontend/index.html || (echo "Missing index.html" && exit 1)
        test -f frontend/app.js || (echo "Missing app.js" && exit 1)
        echo "Frontend files validated"
