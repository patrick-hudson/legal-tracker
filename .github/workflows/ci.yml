name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: backend/package-lock.json

    - name: Install dependencies
      working-directory: ./backend
      run: npm ci

    - name: Run linter (if configured)
      working-directory: ./backend
      run: npm run lint --if-present

    - name: Run tests
      working-directory: ./backend
      run: npm test

    - name: Generate validation report
      if: matrix.node-version == '20.x'
      working-directory: ./backend
      run: npm test -- test/validation-report.test.js

    - name: Archive validation report with timestamp and commit hash
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      run: |
        mkdir -p backend/test/validation-reports
        TIMESTAMP=$(date -u +"%Y%m%d-%H%M%S")
        COMMIT_HASH=$(git rev-parse --short HEAD)
        FILENAME="validation-report-${TIMESTAMP}-${COMMIT_HASH}.json"
        cp backend/test-validation-report.json "backend/test/validation-reports/${FILENAME}"
        echo "Generated report: ${FILENAME}"
        ls -lh backend/test/validation-reports/

    - name: Commit validation report
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add backend/test/validation-reports/
        git diff --staged --quiet || git commit -m "Add validation report for commit $(git rev-parse --short HEAD) [skip ci]"

    - name: Push validation report
      if: matrix.node-version == '20.x' && github.event_name == 'push'
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: ${{ github.ref }}

    - name: Upload validation report as artifact
      if: matrix.node-version == '20.x'
      uses: actions/upload-artifact@v4
      with:
        name: validation-report-${{ github.sha }}
        path: backend/test-validation-report.json
        retention-days: 30

    - name: Build check
      working-directory: ./backend
      run: npm run build --if-present

  lint-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check frontend files exist
      run: |
        test -f frontend/index.html || (echo "Missing index.html" && exit 1)
        test -f frontend/app.js || (echo "Missing app.js" && exit 1)
        echo "Frontend files validated"
