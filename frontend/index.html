<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal Matter Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    * {
      box-sizing: border-box;
    }
    
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      background: var(--bg-color, #1a1408);
      font-family: 'VT323', 'Courier New', monospace;
    }

    /* CRT Effects */
    .crt-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
    }

    .crt-curve {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 0%, rgba(0,0,0,0.3) 90%, rgba(0,0,0,0.6) 100%);
    }

    .crt-scanlines {
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(0deg, transparent 0px, transparent 1px, rgba(0,0,0,0.3) 1px, rgba(0,0,0,0.3) 2px);
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-color, #1a1408);
    }
    ::-webkit-scrollbar-thumb {
      background: var(--primary-dim, #8b6000);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--primary, #ffb000);
    }

    /* Date input styling */
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(0.7) sepia(1) saturate(5) hue-rotate(0deg);
      cursor: pointer;
    }

    /* Animations */
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes crtGlitch {
      0% { transform: translateX(0); }
      25% { transform: translateX(-3px); }
      50% { transform: translateX(3px); }
      75% { transform: translateX(-1px); }
      100% { transform: translateX(0); }
    }

    @keyframes flash {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .blink {
      animation: blink 1s step-end infinite;
    }

    .glitch {
      animation: crtGlitch 0.15s ease-in-out infinite;
    }
  </style>
</head>
<body>
  <div class="crt-overlay">
    <div class="crt-curve"></div>
    <div class="crt-scanlines"></div>
  </div>
  
  <div id="app"></div>
  
  <script type="module" src="app.js"></script>
</body>
</html>
